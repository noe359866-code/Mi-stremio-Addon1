# Despliegue directo del addon de puntuaciones al importar este repositorio.
# No hace falta configurar Base directory: Netlify lee este archivo desde la raíz.
# Para publicar el addon de streams de "Mi Projecto", usa otro sitio de Netlify.

[build]
  base = "ratings-addon"
  command = "npm ci --no-audit --no-fund"
  functions = "netlify/functions"
  publish = "netlify/pub"

[functions]
  # La función importa src/*, fuera de su propia carpeta.
  # esbuild debe incluir esos módulos en el paquete de la función.
  node_bundler = "esbuild"
  # sharp es nativo: sus binarios se copian, no se compilan dentro del bundle JS.
  external_node_modules = ["sharp"]

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

# Stremio necesita rutas públicas como /manifest.json, /catalog/... y /meta/....
# Este proxy las envía todas a la misma función serverless.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ratings"
  status = 200
  force = true
